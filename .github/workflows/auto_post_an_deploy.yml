name: Auto Generate Business Posts & Deploy Jekyll Site

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 UTC
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_posts.py'
      - '.github/workflows/auto_post_and_deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prevent self-trigger loop
        run: |
          LAST_COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          echo "Last commit author: $LAST_COMMIT_AUTHOR"
          if [ "$LAST_COMMIT_AUTHOR" = "github-actions[bot]" ]; then
            echo "Last commit was by the bot. Exiting workflow."
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas python-slugify

      - name: Generate business posts
        run: python scripts/generate_posts.py

      - name: Commit and push posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*.md
          git commit -m "Auto-generate business posts from Google Sheet CSV" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/kasiyah/austin_kz_directory.git HEAD:main
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: auto_post

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: List posts
        run: ls -l _posts

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Bundler
        run: gem install bundler

      - name: Install sass-embedded manually
        run: gem install sass-embedded -v 1.63.6 --platform=ruby

      - name: Install dependencies
        run: |
          bundle config set force_ruby_platform true
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build --future

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
