name: Auto Generate Business Posts & Deploy Jekyll Site

on:
  workflow_dispatch:
  # # runs every day at 6:00 AM UTC (1:00 AM CDT)
  # schedule:
  #   - cron: '0 6 * * *'
  repository_dispatch:
    types: [sheet_updated]

  # runs when changes are pushed to the main branch or when the listed files are modified
  push:
    branches: [main]
    paths:
      - 'scripts/generate_posts.py'
      - '.github/workflows/auto_post_and_deploy.yml'

permissions:
  contents: write # needed to commit and push the generated posts
  pages: write    # needed to publish to GitHub Pages
  id-token: write # needed so deploy-pages can verify the deployment source

# prevents overlaping runs 
concurrency:
  group: pages              # runs in the same group wait for each other to finish before starting
  cancel-in-progress: false # deployment already underway is never cancelled by a newer run

jobs:
  # generates business posts from a Google Sheet CSV and commits them to main branch
  auto_post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas python-slugify

      - name: Generate business posts
        run: python scripts/generate_posts.py

      - name: Commit and push posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Auto-generate business posts from Google Sheet CSV" || echo "No changes to commit"
          git push origin HEAD:main

  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: auto_post
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4