name: Auto Generate Business Posts

# Triggers: manual, push, and scheduled
on:
  workflow_dispatch:   # Manual trigger button
  push:
    branches:
      - main           # Trigger on push to main
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout the repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3️⃣ Install Python dependencies
    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install pandas python-slugify

    # 4️⃣ Generate posts from Google Sheet
    - name: Run post generation script
      run: |
        python scripts/generate_posts.py

    # 5️⃣ Commit and push new posts safely
    - name: Commit and push generated posts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/*.md
        git commit -m "Auto-generate business posts from CSV" || echo "No changes to commit"
        git fetch origin main
        git rebase origin/main || echo "No rebase needed"
        git push origin main

    # 6️⃣ Build and deploy Jekyll site
    - name: Build and deploy Jekyll site
      uses: helaili/jekyll-action@v2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
