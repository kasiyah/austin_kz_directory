name: Auto Generate Business Posts & Deploy Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas python-slugify

    - name: Generate business posts
      run: |
        python scripts/generate_posts.py

    - name: Commit and push new posts safely
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/*.md
        git commit -m "Auto‑generate business posts from CSV" || echo "No changes to commit"
        git fetch origin main
        git rebase origin/main || echo "No rebase needed"
        git push origin main

    - name: Build and deploy Jekyll site
      uses: helaili/jekyll-action@v2  # use valid version
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
