name: Auto Generate Business Posts & Deploy Site

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: '0 6 * * *'  # daily at 6:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3️⃣ Install Python dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas python-slugify

    # 4️⃣ Generate business posts
    - name: Generate business posts
      run: python scripts/generate_posts.py

    # 5️⃣ Commit and push new posts using PAT
    - name: Commit and push posts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/*.md
        git commit -m "Auto-generate business posts from CSV" || echo "No changes to commit"
        git push https://$PERSONAL_TOKEN@github.com/kasiyah/austin_kz_directory.git HEAD:main --force
      env:
        PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

    # 6️⃣ Build and deploy Jekyll site using the same PAT
    - name: Build and deploy Jekyll site
      uses: helaili/jekyll-action@v2
      with:
        github_token: ${{ secrets.PERSONAL_TOKEN }}
