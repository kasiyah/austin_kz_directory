name: Auto Generate Business Posts & Deploy Site

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: '0 6 * * *'  # daily at 6:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3️⃣ Install Python dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas python-slugify

    # 4️⃣ Generate business posts
    - name: Generate business posts
      run: python scripts/generate_posts.py

    # 5️⃣ Commit and push posts using PAT
    - name: Commit and push posts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/*.md
        git commit -m "Auto-generate business posts from CSV" || echo "No changes to commit"
        git push https://$PERSONAL_TOKEN@github.com/kasiyah/austin_kz_directory.git HEAD:main --force
      env:
        PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

    # 6️⃣ Set up Ruby 3.1 (for Jekyll Theme)
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1

    # 7️⃣ Install Jekyll dependencies
    - name: Install Jekyll dependencies
      run: |
        gem install bundler
        bundle install

    # 8️⃣ Build and deploy Jekyll site
    - name: Build and deploy Jekyll site
      uses: helaili/jekyll-action@v2
      with:
        token: ${{ secrets.PERSONAL_TOKEN }}
        target_branch: gh-pages
        build_dir: _site