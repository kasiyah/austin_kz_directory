name: Auto Generate Business Posts

on:
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6am UTC
  workflow_dispatch:     # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas python-slugify

    - name: Run post generation script
      run: |
        python scripts/generate_posts.py

    - name: Commit and push generated posts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/*.md
        git commit -m "Auto-generate business posts from CSV" || echo "No changes to commit"
        git push

    - name: Build and deploy Jekyll site
      uses: helaili/jekyll-action@v2.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
