# =============================================================================
# One-time helper: creates the labels, milestones and DevOps showcase backlog.
#
# How to use: save this file as .github/workflows/create_devops_backlog.yml on
# the main branch, then go to Actions -> "Create DevOps backlog issues" ->
# Run workflow.
#
# It is safe to run again: an issue is skipped if one with the same title
# already exists (open or closed), and existing milestones are reused.
# To add more backlog items later, add them to the list below and run it again.
# =============================================================================
name: Sync DevOps backlog issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  administration: write

jobs:
  create:
    concurrency:
      group: devops-backlog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Create labels, milestones and issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ---- Labels (name|color|description). --force updates if it exists.
          while IFS='|' read -r name color desc; do
            gh label create "$name" --color "$color" --description "$desc" --force < /dev/null
          done << 'LABELS'
          devops|1d76db|Containers, Kubernetes, CI/CD, monitoring
          terraform|7b42bc|Infrastructure as code
          ai-agent|5319e7|Listing review agent
          later|ededed|Parked until budget or domain is available
          priority: high|d93f0b|Do first
          priority: medium|fbca04|Do next
          priority: low|c5def5|Nice to have
          data-quality|ff7b00|Sheet validation, stable IDs, data hygiene
          listings|57606a|Business listing features and UX
          backlog|1d76db|Part of the DevOps showcase backlog
          security|e11d48|Hardening, secrets, scanning, access control
          docs|006b75|README, diagrams, runbooks, decisions
          LABELS

          # ---- Milestones (title|description). Existing ones are reused.
          existing_ms=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq '.[].title' < /dev/null)
          while IFS='|' read -r title desc; do
            if grep -Fxq -- "$title" <<< "$existing_ms"; then
              echo "Milestone exists: $title"
              continue
            fi
            gh api "repos/$GH_REPO/milestones" -f title="$title" -f description="$desc" > /dev/null < /dev/null
            echo "Created milestone: $title"
          done << 'MILESTONES'
          Phase 1 - Containers and hosting|Docker images, local compose, GHCR, health endpoints, Makefile
          Phase 2 - Kubernetes and Helm|kind, Helm chart, CronJob, CI smoke tests
          Phase 3 - Observability|Prometheus, Grafana, exporters, dashboards, alerts, SLOs
          Phase 4 - Security and production hardening|Hardening, scanning, OIDC, network policy, RBAC
          Phase 5 - Terraform|Terraform foundation, repo as code, CI, kind as code
          Phase 6 - AI agent|Listing review agent and scheduled reports
          Phase 7 - Showcase docs|README, architecture diagram, decisions log, runbooks
          Phase 8 - Data quality and sheet foundations|Sheet validation, stable IDs, tags, status workflow
          Phase 9 - Listings enhancements|Website UX and discovery improvements
          Phase 10 - Later and optional|Domain, spend, larger projects, optional cloud VM
          MILESTONES

          # ---- The backlog: one entry per issue (labels are comma-separated).
          cat > backlog.json << 'JSON'
          [
            {
              "title": "Decide hosting before making the repo private",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: high",
              "body": "GitHub Pages from a private repo needs a paid plan on the Free tier. Decide before switching the repo to private, otherwise the deploy stops working.\n\nOptions:\n- GitHub Pro (about $4/month): keeps Pages, adds branch protection and more Actions minutes\n- Cloudflare Pages ($0): rebuild the deploy step, works with a private repo\n- Keep the repo public, or split into a public site repo and a private repo\n\n- [ ] Choose an option and note it in docs/decisions.md\n- [ ] Migrate the deploy job if needed\n- [ ] Verify the 'Publish to site' flow still works end to end"
            },
            {
              "title": "Dockerize the Jekyll build (multi-stage, nginx)",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: high",
              "body": "Multi-stage Dockerfile: a Ruby stage builds the site, an nginx stage serves _site.\n\n- [ ] Image builds locally and serves the site on localhost\n- [ ] Pinned base image versions\n- [ ] Runs as a non-root user\n- [ ] .dockerignore added"
            },
            {
              "title": "Add docker-compose for local development",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: high",
              "body": "- [ ] Jekyll service with live reload\n- [ ] Service for running generate_posts.py\n- [ ] 'docker compose up' gives a working local site with no Ruby install\n- [ ] Documented in the README"
            },
            {
              "title": "Containerize the post generator script",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: high",
              "body": "Small Python image for scripts/generate_posts.py.\n\n- [ ] Sheet CSV URL passed as an environment variable\n- [ ] Same image usable locally, in compose, in CI and later in Kubernetes"
            },
            {
              "title": "Build and push images to GHCR from GitHub Actions",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: high",
              "body": "- [ ] Build on pull requests (no push), push on main\n- [ ] Tag with commit SHA and latest\n- [ ] Vulnerability scan with Trivy\n- [ ] Keep images small and prune old tags (the free plan has limited Packages storage for private repos)\n- [ ] Keep an eye on Actions minutes (the free plan has a monthly allowance for private repos)"
            },
            {
              "title": "Add health, readiness, and build-info endpoints to the site image",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: high",
              "body": "Give Kubernetes and CI something meaningful to probe.\n\n- [ ] /healthz endpoint returns 200\n- [ ] /readyz endpoint returns 200\n- [ ] /build-info.json exposes commit, build time, and listing count\n- [ ] Endpoints used by Docker healthcheck and Kubernetes probes"
            },
            {
              "title": "Add a Makefile for local development",
              "milestone": "Phase 1 - Containers and hosting",
              "labels": "devops,priority: medium",
              "body": "Make local setup repeatable.\n\n- [ ] make up starts Docker Compose\n- [ ] make kind creates the local cluster\n- [ ] make deploy installs the Helm chart\n- [ ] make observe port-forwards Grafana and Prometheus\n- [ ] README quick start uses the Makefile"
            },
            {
              "title": "Run the site on a local kind cluster with plain manifests",
              "milestone": "Phase 2 - Kubernetes and Helm",
              "labels": "devops,priority: high",
              "body": "- [ ] Deployment, Service and Ingress for the nginx image\n- [ ] Liveness and readiness probes\n- [ ] Resource requests and limits\n- [ ] Site reachable through the ingress on localhost"
            },
            {
              "title": "Package the deployment as a Helm chart",
              "milestone": "Phase 2 - Kubernetes and Helm",
              "labels": "devops,priority: high",
              "body": "- [ ] Chart in charts/directory/\n- [ ] Values for image tag, replicas, resources, ingress host\n- [ ] helm lint and helm template run in CI"
            },
            {
              "title": "Add a CronJob for scheduled post regeneration",
              "milestone": "Phase 2 - Kubernetes and Helm",
              "labels": "devops,priority: medium",
              "body": "Runs the generator image on a schedule, as an alternative to the Sheet-triggered workflow.\n\n- [ ] Sheet CSV URL stored in a Secret or ConfigMap\n- [ ] Job history limits and failure handling configured"
            },
            {
              "title": "Add a kind smoke test to CI",
              "milestone": "Phase 2 - Kubernetes and Helm",
              "labels": "devops,priority: medium",
              "body": "Start kind in a GitHub Actions job, helm install, and check the site responds with 200.\n\n- [ ] Fails the pull request if the check fails\n- [ ] Only runs when chart or image files change (path filters)\n- [ ] Image layers cached to save Actions minutes"
            },
            {
              "title": "Install Prometheus and Grafana locally with kube-prometheus-stack",
              "milestone": "Phase 3 - Observability",
              "labels": "devops,priority: medium",
              "body": "- [ ] Installed with Helm using a values file kept in the repo\n- [ ] Prometheus and Grafana reachable via port-forward\n- [ ] Install steps documented"
            },
            {
              "title": "Expose nginx metrics (exporter sidecar and ServiceMonitor)",
              "milestone": "Phase 3 - Observability",
              "labels": "devops,priority: medium",
              "body": "- [ ] nginx exporter added to the chart as a sidecar\n- [ ] ServiceMonitor picked up by Prometheus\n- [ ] Request rate and status codes visible in Prometheus"
            },
            {
              "title": "Add pipeline and build-info metrics exporter",
              "milestone": "Phase 3 - Observability",
              "labels": "devops,priority: high",
              "body": "Monitor the content pipeline, not just the website.\n\n- [ ] Small exporter service exposes /metrics\n- [ ] directory_listings_total metric exposed\n- [ ] directory_last_successful_build_timestamp_seconds exposed\n- [ ] directory_build_commit label exposed\n- [ ] ServiceMonitor added to the Helm chart"
            },
            {
              "title": "Build a Grafana dashboard and alert rule as code",
              "milestone": "Phase 3 - Observability",
              "labels": "devops,priority: medium",
              "body": "- [ ] Dashboard JSON committed to the repo and loaded automatically\n- [ ] Panels: request rate, error rate, latency, pod restarts\n- [ ] Alert rule if the site is down for more than 5 minutes"
            },
            {
              "title": "Add SLO dashboard for availability, latency, and freshness",
              "milestone": "Phase 3 - Observability",
              "labels": "devops,priority: medium",
              "body": "Make the operational goals visible.\n\n- [ ] Availability panel from probe success\n- [ ] Latency p50/p95/p99 panel\n- [ ] Data freshness panel\n- [ ] Current commit and listing count panels\n- [ ] Dashboard JSON committed to repo"
            },
            {
              "title": "Add content freshness alerts",
              "milestone": "Phase 3 - Observability",
              "labels": "devops,priority: medium",
              "body": "Alert when the site is up but the data pipeline is stale.\n\n- [ ] Alert if successful build is older than 7 days\n- [ ] Alert if sheet update is newer than last successful build\n- [ ] Alertmanager route configured\n- [ ] Alert tested with a fake stale metric"
            },
            {
              "title": "Add security hardening baseline to the Helm chart",
              "milestone": "Phase 4 - Security and production hardening",
              "labels": "devops,security,priority: high",
              "body": "Make the deployment production-like.\n\n- [ ] Containers run as non-root\n- [ ] readOnlyRootFilesystem enabled where practical\n- [ ] Privilege escalation disabled\n- [ ] Linux capabilities dropped\n- [ ] Resource requests and limits required\n- [ ] PodDisruptionBudget added"
            },
            {
              "title": "Add NetworkPolicy and RBAC guardrails",
              "milestone": "Phase 4 - Security and production hardening",
              "labels": "devops,security,priority: medium",
              "body": "Reduce the blast radius of the local cluster.\n\n- [ ] Ingress to the web service allowed only from the ingress controller\n- [ ] Metrics scraping allowed only from Prometheus\n- [ ] ServiceAccounts scoped per workload\n- [ ] NetworkPolicy tested with curl from a debug pod"
            },
            {
              "title": "Add Trivy image and config scanning to CI",
              "milestone": "Phase 4 - Security and production hardening",
              "labels": "devops,security,priority: medium",
              "body": "Catch vulnerable images and bad Kubernetes config before merge.\n\n- [ ] Trivy image scan on PRs\n- [ ] Trivy config scan for Dockerfiles and Helm templates\n- [ ] Critical findings fail the workflow\n- [ ] Scan summary posted to the pull request"
            },
            {
              "title": "Add OIDC authentication for GHCR and cluster deployment",
              "milestone": "Phase 4 - Security and production hardening",
              "labels": "devops,security,priority: medium",
              "body": "Remove long-lived deployment secrets.\n\n- [ ] GHCR push uses short-lived OIDC token\n- [ ] Cluster auth uses OIDC where the provider supports it\n- [ ] No long-lived kubeconfig or registry password in GitHub secrets\n- [ ] Deployment workflow tested end to end"
            },
            {
              "title": "Set up Terraform foundation with remote state",
              "milestone": "Phase 5 - Terraform",
              "labels": "terraform,priority: medium",
              "body": "- [ ] infra/ directory with pinned provider versions\n- [ ] .terraform.lock.hcl committed\n- [ ] Remote state on a free tier (for example HCP Terraform), never in git\n- [ ] *.tfstate and *.tfvars in .gitignore\n- [ ] Secrets only in CI secrets"
            },
            {
              "title": "Manage repo labels and milestones with Terraform",
              "milestone": "Phase 5 - Terraform",
              "labels": "terraform,priority: medium",
              "body": "- [ ] Labels and milestones defined with the GitHub provider\n- [ ] Existing ones imported, not recreated\n- [ ] terraform plan shows no drift\n- [ ] Branch protection only if the plan supports it for private repos"
            },
            {
              "title": "Add a Terraform CI workflow",
              "milestone": "Phase 5 - Terraform",
              "labels": "terraform,priority: medium",
              "body": "- [ ] On pull requests: fmt -check, validate, tflint, Trivy config scan, plan\n- [ ] apply is a manual workflow_dispatch (approval gates are limited on the free plan for private repos)\n- [ ] Plan output visible on the pull request"
            },
            {
              "title": "Manage the kind cluster and Helm releases with Terraform",
              "milestone": "Phase 5 - Terraform",
              "labels": "terraform,priority: low",
              "body": "- [ ] kind cluster created by Terraform\n- [ ] Site chart and monitoring stack installed through the Helm provider\n- [ ] terraform destroy cleanly tears everything down"
            },
            {
              "title": "Design the listing review agent and define its scope",
              "milestone": "Phase 6 - AI agent",
              "labels": "ai-agent,priority: medium",
              "body": "Short design doc in docs/agent.md.\n\nThe agent reads Draft rows from the sheet and reports missing or malformed fields, likely duplicates, and suggested tags and a short description. It never publishes on its own; a human approves.\n\n- [ ] Inputs, outputs and failure behavior documented\n- [ ] No paid API required for the baseline version"
            },
            {
              "title": "Implement rule-based checks and tag suggestions",
              "milestone": "Phase 6 - AI agent",
              "labels": "ai-agent,priority: medium",
              "body": "Works without any LLM. Related to #58, #61 and #77.\n\n- [ ] Required-field, phone and address format checks\n- [ ] Duplicate detection\n- [ ] Tag suggestions from keywords, using the tag list from #77\n- [ ] Output as a JSON or Markdown report\n- [ ] Runs from the container image"
            },
            {
              "title": "Run the agent on a schedule and post the report to a GitHub issue",
              "milestone": "Phase 6 - AI agent",
              "labels": "ai-agent,priority: medium",
              "body": "- [ ] CronJob in the local cluster (or Actions with the rule-based version only)\n- [ ] Report posted as an issue comment\n- [ ] Nothing changes without human approval"
            },
            {
              "title": "Add agent metrics to the Grafana dashboard",
              "milestone": "Phase 6 - AI agent",
              "labels": "ai-agent,priority: low",
              "body": "- [ ] Metrics for runs, failures, rows checked and issues found\n- [ ] Panel added to the dashboard JSON"
            },
            {
              "title": "Optional: add a local LLM step with Ollama",
              "milestone": "Phase 6 - AI agent",
              "labels": "ai-agent,priority: low",
              "body": "- [ ] Ollama in a container, small model, runs locally or in the kind cluster\n- [ ] LLM step is optional; the pipeline works without it\n- [ ] Used for descriptions and tag suggestions, with output reviewed by a human"
            },
            {
              "title": "Add an architecture diagram and write the README",
              "milestone": "Phase 7 - Showcase docs",
              "labels": "devops,docs,priority: medium",
              "body": "- [ ] Diagram: Sheet, Actions, hosting, Kubernetes, monitoring, agent\n- [ ] 'What I built and why' section\n- [ ] Quick start for running everything locally"
            },
            {
              "title": "Write a decisions log",
              "milestone": "Phase 7 - Showcase docs",
              "labels": "devops,docs,priority: low",
              "body": "docs/decisions.md\n\n- [ ] Why Pages plus a local Kubernetes deployment\n- [ ] Hosting choice for a private repo\n- [ ] What would change at real scale\n- [ ] Trade-offs and cost choices"
            },
            {
              "title": "Add deployment rollback and runbook docs",
              "milestone": "Phase 7 - Showcase docs",
              "labels": "devops,docs,priority: medium",
              "body": "Document how to recover from a bad release.\n\n- [ ] helm rollback steps documented\n- [ ] image tag rollback steps documented\n- [ ] smoke test commands included\n- [ ] common failure modes documented"
            },
            {
              "title": "Add GitHub Project board automation or view rules",
              "milestone": "Phase 7 - Showcase docs",
              "labels": "devops,docs,priority: low",
              "body": "Keep the backlog board useful.\n\n- [ ] Project view grouped by milestone\n- [ ] Swimslane or filter by priority\n- [ ] Label backlog applied to generated issues\n- [ ] Duplicate issues closed and tracked"
            },
            {
              "title": "Add dropdowns and required fields to the Google Sheet",
              "milestone": "Phase 8 - Data quality and sheet foundations",
              "labels": "data-quality,priority: high",
              "body": "Reduce bad rows before they reach the generator.\n\n- [ ] Required fields enforced for name, category, region, and at least one contact method\n- [ ] Dropdowns added for category, region, and status\n- [ ] Helper legend added near the sheet\n- [ ] Generator behavior documented for incomplete rows"
            },
            {
              "title": "Add a stable ID column so renames keep the same post and date",
              "milestone": "Phase 8 - Data quality and sheet foundations",
              "labels": "data-quality,priority: high",
              "body": "Prevent URL and date churn when a business name changes.\n\n- [ ] Stable ID column added to the sheet\n- [ ] Generator uses stable ID for slug preservation where possible\n- [ ] Renamed business keeps the same post URL\n- [ ] Migration plan added for existing rows"
            },
            {
              "title": "Add a validation report to generate_posts.py",
              "milestone": "Phase 8 - Data quality and sheet foundations",
              "labels": "data-quality,priority: high",
              "body": "Make bad data visible before deployment.\n\n- [ ] Report missing required fields\n- [ ] Report invalid phone, email, URL, and address formats\n- [ ] Report duplicate names and likely duplicates\n- [ ] Output Markdown or JSON report\n- [ ] CI fails on critical validation errors"
            },
            {
              "title": "Add a Tags column to the sheet and define the tag list",
              "milestone": "Phase 8 - Data quality and sheet foundations",
              "labels": "listings,data-quality,priority: high",
              "body": "Tags power search and the later AI agent tag suggestions.\n\n- [ ] Tags column added\n- [ ] Controlled tag list defined\n- [ ] Tags normalized in generate_posts.py\n- [ ] Tag filter behavior documented"
            },
            {
              "title": "Add a Status column (Draft / Approved) and a Google Form for submissions",
              "milestone": "Phase 8 - Data quality and sheet foundations",
              "labels": "data-quality,priority: medium",
              "body": "Add a moderation workflow so community submissions do not publish immediately.\n\n- [ ] Status column added with Draft / Approved dropdown\n- [ ] Generator publishes Approved rows only\n- [ ] Google Form writes new submissions as Draft rows\n- [ ] Owner approval flow documented"
            },
            {
              "title": "Make phone numbers click-to-call and addresses open in Google Maps",
              "milestone": "Phase 9 - Listings enhancements",
              "labels": "listings,priority: high",
              "body": "Improve mobile usability for community members.\n\n- [ ] Phone numbers rendered as tel: links\n- [ ] Addresses rendered as Google Maps links\n- [ ] Jekyll Liquid filters or Python generator updated\n- [ ] Existing posts regenerated correctly"
            },
            {
              "title": "Add an Image column for logos and photos",
              "milestone": "Phase 9 - Listings enhancements",
              "labels": "listings,priority: medium",
              "body": "Add optional business imagery.\n\n- [ ] Image URL column added\n- [ ] Fallback logo behavior defined\n- [ ] Images displayed on post and home page cards\n- [ ] Broken image handling documented"
            },
            {
              "title": "Add a 'Suggest a correction' link to every post",
              "milestone": "Phase 9 - Listings enhancements",
              "labels": "listings,priority: medium",
              "body": "Give community members a safe way to report issues.\n\n- [ ] Correction link added to every post\n- [ ] Link opens a prefilled GitHub issue or Google Form\n- [ ] Issue template includes business name and stable ID\n- [ ] Moderation flow documented"
            },
            {
              "title": "Add a Featured column and Featured / Recently added sections on the home page",
              "milestone": "Phase 9 - Listings enhancements",
              "labels": "listings,priority: low",
              "body": "Make the home page more useful for discovery.\n\n- [ ] Featured column added to sheet\n- [ ] Featured section rendered on home page\n- [ ] Recently added section rendered using post date\n- [ ] Layout checked on mobile"
            },
            {
              "title": "Add a map view of all businesses (larger project)",
              "milestone": "Phase 10 - Later and optional",
              "labels": "listings,later,priority: low",
              "body": "Larger discovery feature.\n\n- [ ] Choose map provider with free tier\n- [ ] Parse addresses safely\n- [ ] Render map with business markers\n- [ ] Mobile layout verified"
            },
            {
              "title": "Buy a domain and manage DNS with Terraform",
              "milestone": "Phase 10 - Later and optional",
              "labels": "terraform,later,priority: low",
              "body": "Parked until the rest of the showcase is in good shape.\n\n- [ ] Choose a registrar with clear renewal pricing\n- [ ] DNS hosted on a provider with a Terraform provider\n- [ ] Records managed in Terraform"
            },
            {
              "title": "Attach the custom domain to hosting",
              "milestone": "Phase 10 - Later and optional",
              "labels": "devops,later,priority: low",
              "body": "- [ ] Custom domain configured with HTTPS\n- [ ] Jekyll url and baseurl updated\n- [ ] Old address still redirects\n- [ ] Publish workflow still deploys correctly"
            },
            {
              "title": "Optional: provision a small cloud VM with k3s using Terraform",
              "milestone": "Phase 10 - Later and optional",
              "labels": "terraform,later,priority: low",
              "body": "Only if budget allows.\n\n- [ ] VM and firewall rules in Terraform\n- [ ] Helm chart deployed to it\n- [ ] Teardown documented to control cost"
            }
          ]
          JSON

          # ---- Fetch existing issues so we can update open issues and avoid duplicates.
          gh issue list --state open --limit 500 --json number,title > open_issues.json < /dev/null
          gh issue list --state closed --limit 500 --json number,title > closed_issues.json < /dev/null

          # ---- Create or update each issue.
          jq -c '.[]' backlog.json | while read -r item; do
            title=$(jq -r '.title' <<< "$item")
            milestone=$(jq -r '.milestone' <<< "$item")
            labels=$(jq -r '.labels' <<< "$item")
            labels="${labels},backlog"
            body=$(jq -r '.body' <<< "$item")

            open_number=$(jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | .[0] // empty' open_issues.json)
            closed_number=$(jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | .[0] // empty' closed_issues.json)

            add_label_args=()
            create_label_args=()
            IFS=',' read -r -a label_parts <<< "$labels"
            for label_part in "${label_parts[@]}"; do
              if [[ -z "$label_part" ]]; then
                continue
              fi
              add_label_args+=(--add-label "$label_part")
              create_label_args+=(--label "$label_part")
            done

            if [[ -n "$open_number" ]]; then
              echo "Updating existing open issue #$open_number: $title"
              gh issue edit "$open_number" --milestone "$milestone" "${add_label_args[@]}" < /dev/null
            elif [[ -n "$closed_number" ]]; then
              echo "Skipping closed issue #$closed_number: $title"
              continue
            else
              echo "Creating issue: $title"
              gh issue create --title "$title" --milestone "$milestone" "${create_label_args[@]}" --body "$body" < /dev/null
            fi

            sleep 1
          done

