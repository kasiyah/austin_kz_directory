name: Generate Business Posts & Deploy Site

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 UTC

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3️⃣ Install Python dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas python-slugify

    # 4️⃣ Generate business posts
    - name: Generate business posts
      run: python scripts/generate_posts.py

    # 5️⃣ Check for changes and commit
    - name: Commit and push posts if there are changes
      id: git-check
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/*.md
